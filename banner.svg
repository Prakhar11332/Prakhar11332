<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a"/>
      <stop offset="100%" stop-color="#0d0d16"/>
    </linearGradient>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(120,20,190,0.95)"/>
      <stop offset="20%" stop-color="rgba(120,20,190,0.65)"/>
      <stop offset="55%" stop-color="rgba(120,20,190,0.25)"/>
      <stop offset="100%" stop-color="rgba(120,20,190,0)"/>
    </radialGradient>

    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(40,25,235,0.9)"/>
      <stop offset="20%" stop-color="rgba(40,25,235,0.6)"/>
      <stop offset="55%" stop-color="rgba(40,25,235,0.22)"/>
      <stop offset="100%" stop-color="rgba(40,25,235,0)"/>
    </radialGradient>

    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(90,15,255,0.85)"/>
      <stop offset="20%" stop-color="rgba(90,15,255,0.55)"/>
      <stop offset="55%" stop-color="rgba(90,15,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(90,15,255,0)"/>
    </radialGradient>

    <filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="glowSmall" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)"/>

  <!-- floating gradient blobs, mimicking the canvas mouse-trail glow -->
  <g filter="url(#softBlur)" opacity="0.8" style="mix-blend-mode:screen">
    <circle r="150" fill="url(#blob1)">
      <animate attributeName="cx" values="120;900;300;1050;120" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;300;340;100;80" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle r="130" fill="url(#blob2)">
      <animate attributeName="cx" values="1000;250;750;60;1000" dur="26s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="340;120;60;280;340" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle r="110" fill="url(#blob3)">
      <animate attributeName="cx" values="600;80;1100;550;600" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;260;320;40;60" dur="19s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- terminal window -->
  <g>
    <rect x="60" y="50" width="1080" height="320" rx="12"
          fill="#0b0b12" fill-opacity="0.72" stroke="#2a2a38" stroke-width="1.2"/>

    <!-- title bar -->
    <rect x="60" y="50" width="1080" height="38" rx="12" fill="#12121c" fill-opacity="0.85"/>
    <rect x="60" y="76" width="1080" height="12" fill="#12121c" fill-opacity="0.85"/>
    <circle cx="88" cy="69" r="6" fill="#ff5f56"/>
    <circle cx="108" cy="69" r="6" fill="#ffbd2e"/>
    <circle cx="128" cy="69" r="6" fill="#27c93f"/>
    <text x="600" y="74" text-anchor="middle" font-family="Menlo, Consolas, monospace"
          font-size="13" fill="#8a8a9a">prakhar@amrita:~</text>

    <!-- terminal body text -->
    <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16">
      <text x="88" y="126" fill="#5fd3a4">$ <tspan fill="#e6e6f0">whoami</tspan></text>
      <text x="88" y="154" fill="#8a8a9a">&gt; Prakhar — B.Tech CSE (AI), Semester 5, Amrita Vishwa Vidyapeetham</text>
      <text x="88" y="180" fill="#8a8a9a">&gt; ID: CB.SC.U4AIE24366</text>

      <text x="88" y="220" fill="#5fd3a4">$ <tspan fill="#e6e6f0">current_focus</tspan></text>
      <text x="88" y="248" fill="#8a8a9a">&gt; [x] Full-stack AI systems — Next.js + FastAPI + Postgres/pgvector</text>
      <text x="88" y="274" fill="#8a8a9a">&gt; [x] Agentic workflows &amp; MCP servers (see Runway below)</text>

      <text x="88" y="314" fill="#5fd3a4">$ <tspan fill="#e6e6f0">status</tspan></text>
      <text x="88" y="342" fill="#c9a4ff">&gt; building solo, shipping in public, one clean commit at a time</text>

      <!-- blinking cursor -->
      <rect x="88" y="352" width="10" height="16" fill="#5fd3a4">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
